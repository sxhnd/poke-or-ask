[project]
name = "poke-or-ask"
version = "0.1.0"
description = "A simulated robot that pokes an unseen door and asks a human when unsure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
]

[project.scripts]
poke-or-ask = "poke_or_ask.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "hypothesis>=6.170.5",
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "ERA", "F", "FBT", "FIX",
    "G", "I", "ICN", "INP", "ISC", "LOG", "N", "NPY", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
    "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TD", "TID", "TRY", "UP", "W",
    "RUF069",
]
ignore = [
    # assert is allowed for internal invariants.
    "S101",
    # Error messages carry their values at the raise site.
    "TRY003",
    # TODO is an allowed tag; the TD rules check its format.
    "FIX002",
    # Magic methods document themselves through the data model.
    "D105",
]
# Preview mode is on only so that RUF069 (float equality) can be selected by
# name; explicit-preview-rules keeps every other preview rule out of the selection.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "INP001", "PLR2004"]
"scripts/**" = ["INP001"]
"src/*/cli.py" = ["BLE001", "T201", "TID251"]

[tool.ruff.lint.pycodestyle]
# PEP 8 allows 99-column code on the condition that prose still wraps at 72.
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-branches = 10
max-returns = 5
max-statements = 30

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc".msg = "Use typing.Protocol."
"numpy.linalg.inv".msg = "Solve the system with numpy.linalg.solve."
"os.environ".msg = "Read configuration in cli.py and pass it in."
"os.getenv".msg = "Read configuration in cli.py and pass it in."
"random".msg = "Pass in a seeded numpy.random.Generator."

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["poke_or_ask"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
